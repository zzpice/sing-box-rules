name: Build SRS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-srs
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.14.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate rule sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load_rules(name):
              data = json.loads(Path(name).read_text(encoding="utf-8"))
              if data.get("version") != 5:
                  raise SystemExit(f"{name}: version must be 5")
              rules = data.get("rules")
              if not isinstance(rules, list):
                  raise SystemExit(f"{name}: rules must be an array")

              collected = {"domain": [], "domain_suffix": []}
              for rule_index, rule in enumerate(rules):
                  if not isinstance(rule, dict):
                      raise SystemExit(f"{name}: rules[{rule_index}] must be an object")
                  for field in collected:
                      values = rule.get(field, [])
                      if not isinstance(values, list) or not all(isinstance(value, str) and value.strip() for value in values):
                          raise SystemExit(f"{name}: rules[{rule_index}].{field} must be an array of non-empty strings")
                      collected[field].extend(value.strip().lower().rstrip(".") for value in values)

              for field, values in collected.items():
                  duplicates = sorted({value for value in values if values.count(value) > 1})
                  if duplicates:
                      raise SystemExit(f"{name}: duplicate {field}: {', '.join(duplicates)}")

              print(f"{name}: OK")
              return {field: set(values) for field, values in collected.items()}

          proxy = load_rules("proxy.json")
          direct = load_rules("direct.json")

          conflicts = []
          conflicts.extend(f"domain:{value}" for value in sorted(proxy["domain"] & direct["domain"]))

          for proxy_suffix in proxy["domain_suffix"]:
              for direct_suffix in direct["domain_suffix"]:
                  if (
                      proxy_suffix == direct_suffix
                      or proxy_suffix.endswith("." + direct_suffix)
                      or direct_suffix.endswith("." + proxy_suffix)
                  ):
                      conflicts.append(f"domain_suffix:{proxy_suffix} <-> {direct_suffix}")

          for domain in proxy["domain"]:
              for suffix in direct["domain_suffix"]:
                  if domain == suffix or domain.endswith("." + suffix):
                      conflicts.append(f"proxy domain {domain} overlaps direct suffix {suffix}")

          for domain in direct["domain"]:
              for suffix in proxy["domain_suffix"]:
                  if domain == suffix or domain.endswith("." + suffix):
                      conflicts.append(f"direct domain {domain} overlaps proxy suffix {suffix}")

          if conflicts:
              raise SystemExit("proxy/direct conflict: " + "; ".join(sorted(conflicts)))

          print("proxy/direct: no overlap")
          PY

      - name: Download sing-box
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/sing-box.tar.gz"
          directory="$RUNNER_TEMP/sing-box-$SING_BOX_VERSION-linux-amd64"
          url="https://github.com/SagerNet/sing-box/releases/download/v$SING_BOX_VERSION/sing-box-$SING_BOX_VERSION-linux-amd64.tar.gz"

          curl -fsSL --retry 3 --retry-delay 2 -o "$archive" "$url"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          cp "$directory/sing-box" "$RUNNER_TEMP/sing-box"
          chmod +x "$RUNNER_TEMP/sing-box"
          "$RUNNER_TEMP/sing-box" version

      - name: Compile rule sets
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/sing-box" rule-set compile --output proxy.srs proxy.json
          "$RUNNER_TEMP/sing-box" rule-set compile --output direct.srs direct.json

      - name: Commit generated SRS
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain -- proxy.srs direct.srs)" ]]; then
            echo "SRS files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxy.srs direct.srs
          git commit -m "chore: update generated SRS"
          git push
